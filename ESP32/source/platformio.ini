[platformio]
default_envs = waveshare_game
[env]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.partitions = huge_app.csv
board_build.arduino.memory_type = opi_opi
board_build.flash_mode = opi
board_upload.flash_size = 32MB
board_upload.maximum_size = 3145728
monitor_speed = 115200
build_unflags = -DARDUINO_EVENT_RUNNING_CORE=1
build_flags =
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display@3.0.12
    adafruit/Adafruit GFX Library@1.12.1
[env:waveshare_game]
[env:waveshare_hockey_test]
build_flags =
    ${env.build_flags}
    -DSMASH_HOCKEY_TEST=1
[env:waveshare_demo]
build_flags =
    ${env.build_flags}
    -DSMASH_DEMO=1
[env:waveshare_test]
build_flags =
    ${env.build_flags}
    -DSMASH_TEST=1

[env:waveshare_strange_test]
build_flags =
    ${env.build_flags}
    -DSMASH_STRANGE_TEST=1

[env:waveshare_strange_check]
build_flags =
    ${env.build_flags}
    -DSMASH_STRANGE_CHECK=1
